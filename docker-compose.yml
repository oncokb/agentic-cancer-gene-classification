services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - agcg-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  annotation-service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  annotation-service-local:
    profiles: ["local"]
    build:
      context: .
      args:
        INSTALL_LOCAL_AGENTS: "true"
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=INFO
      - HOME=/home/appuser
      - CODEX_HOME=/home/appuser/.codex
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ${HOME}/.codex:/home/appuser/.codex
      - ${HOME}/.claude:/home/appuser/.claude
      - ${HOME}/.claude.json:/home/appuser/.claude.json
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  agcg-redis-data:
