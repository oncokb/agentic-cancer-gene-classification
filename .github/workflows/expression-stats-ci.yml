name: Expression stats CI
on:
  pull_request:
    paths: ['expression_stats/**', '.github/workflows/expression-stats-*.yml']
  push:
    paths: ['expression_stats/**', '.github/workflows/expression-stats-*.yml']
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expression_stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: expression_stats/constraints.txt
      - run: pip install -c constraints.txt setuptools
      - run: pip install --no-build-isolation -c constraints.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest
