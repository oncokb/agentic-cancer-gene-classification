name: Expression stats CI
on:
  pull_request:
    paths: ['src/**', 'expression_stats/**', '.github/workflows/expression-stats-*.yml']
  push:
    paths: ['src/**', 'expression_stats/**', '.github/workflows/expression-stats-*.yml']
permissions:
  contents: read
env:
  # Keep NumPy's dispatched transcendental functions on one x86 code path across runners.
  NPY_DISABLE_CPU_FEATURES: AVX AVX2 FMA3 AVX512F AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expression_stats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: expression_stats/constraints.txt
      - run: pip install -c constraints.txt setuptools
      - run: pip install --no-build-isolation -c constraints.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest
